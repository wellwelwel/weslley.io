name: '🚀 CD (Website) — Publish'

on:
  schedule:
    # - cron: '30 3 * * *'
    # - cron: '30 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
    # - cron: '30 18 * * *'
    # - cron: '30 21 * * *'
    # - cron: '30 0 * * *'
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    steps:
      - name: Actions - Checkout
        uses: actions/checkout@v6

      - name: Actions - Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Installing Dependencies
        run: bun install --frozen-lockfile

      - name: Checking Types
        run: bun run typecheck

      - name: Checking Lint
        run: bun run lint

      - name: Testing
        run: bun run test

      - name: Building Site
        run: |
          bun run build:server
          bun run build
        env:
          COUNTTY_URL: ${{ secrets.COUNTTY_URL }}
          COUNTTY_TOKEN: ${{ secrets.COUNTTY_TOKEN }}

      - name: Deploy — Server
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./server
          publish_branch: 'server'
          allow_empty_commit: false
          enable_jekyll: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: weslley.io
          allow_empty_commit: false
